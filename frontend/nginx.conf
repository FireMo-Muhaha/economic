server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver — resolve upstream lazily at request time
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve static files with caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2|woff|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy /api/* to the api service (lazy resolve via variable)
    location /api/ {
        set $api_upstream http://api:80;
        proxy_pass         $api_upstream$request_uri;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location /health {
        set $api_upstream http://api:80;
        proxy_pass         $api_upstream$request_uri;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
        proxy_connect_timeout 5s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
