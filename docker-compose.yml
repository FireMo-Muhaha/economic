services:

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "8080:80"          
    depends_on:
      - api
    networks:
      - kh-network
    restart: unless-stopped

  backend:
    container_name: backend
    build:
      context: ./backend
    ports:
      - "8081:80"         
    depends_on:
      - api
    networks:
      - kh-network
    restart: unless-stopped

  api:
    container_name: api
    build:
      context: ./api

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: kh_department
      DB_USER: kh_user
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kh-network
    restart: unless-stopped

  mysql:
    container_name: mysql
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kh_department
      MYSQL_USER: kh_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - kh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:latest
    ports:
      - "8082:80"          
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      - mysql
    networks:
      - kh-network
    restart: unless-stopped

networks:
  kh-network:
    driver: bridge

volumes:
  mysql-data:
